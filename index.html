<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="app">
        <header class="header">
            <h1>Weatherly</h1>
            <p>Weather Dashboard</p>
        </header>

        <section class="search-box"></section>
         <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >
            <button id="searchBtn">Search</button>
            </section>

            <section class="weather-card"></section>
            <p>Current Weather</p>

            <h2 id="cityName">City Name</h2>

            <h3 id="temperature">--°C</h3>

            <p id="condition">Weather Condition</p>
              <section class="details">

                <article class="detail-card">
                    <p>Humidity</p>
                    <h4 id="humidity">--%</h4>
                </article>

                <article class="detail-card">
                    <p>Wind Speed</p>
                    <h4 id="wind">-- m/s</h4>
                </article>

            </section>

        </section>
        <section class="info">

            <article>
                <h3>Real-time Data</h3>
                <p>Get the latest weather information for your city.</p>
            </article>

            <article>
                <h3>Fast & Simple</h3>
                <p>Search any city and instantly view its weather.</p>
            </article>

        </section>
         <footer>
            Weatherly © 2026 | Powered by OpenWeather
        </footer>

    </main>
    <script src="script.js"></script>
    
    </body>
</html>
